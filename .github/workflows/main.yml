name: 每日更新 data.js

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 北京时间 18:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python update_data_auto.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js backup_high.json
          git diff --staged --quiet || (git commit -m "每日数据更新 [skip ci]" && git push)
