name: 每日更新 data.js

on:
  schedule:
    # 北京时间 18:00 (UTC 10:00) 周一至周五
    - cron: '0 10 * * 1-5'
  workflow_dispatch:   # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行数据更新脚本
        run: python update_data_multisource.py

      - name: 提交 data.js 到仓库
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "每日数据自动更新" && git push)
